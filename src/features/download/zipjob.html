<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Скачивание плейлиста — YMX-tools</title>
<style>
    * { box-sizing: border-box; }
    body {
        margin: 0;
        padding: 28px;
        background: #141414;
        color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
        font-size: 14px;
    }
    .ymt-card {
        max-width: 640px;
        margin: 0 auto;
        padding: 24px;
        border-radius: 18px;
        background: rgba(255,255,255,0.05);
        border: 1px solid rgba(255,255,255,0.1);
    }
    .ymt-title {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 4px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .ymt-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 18px; }
    .ymt-bar { height: 10px; border-radius: 5px; background: rgba(255,255,255,0.12); overflow: hidden; margin-bottom: 12px; }
    .ymt-fill { height: 100%; width: 0; border-radius: 5px; background: linear-gradient(90deg, #ffdd00, #ffff00); transition: width 0.25s ease; }
    .ymt-meta { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 10px; }
    .ymt-errcount { color: #ff8a80; }
    .ymt-current { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.8); margin-bottom: 12px; min-height: 18px; }
    .ymt-cur-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ymt-muted { color: rgba(255,255,255,0.4); }
    .ymt-spinner {
        display: inline-block; width: 12px; height: 12px; flex-shrink: 0;
        border: 2px solid rgba(255,255,0,0.3); border-top-color: #ffff00;
        border-radius: 50%; animation: ymt-spin 0.8s linear infinite;
    }
    @keyframes ymt-spin { to { transform: rotate(360deg); } }
    .ymt-errors { font-size: 12px; color: #ff8a80; max-height: 110px; overflow-y: auto; }
    .ymt-errline { padding: 1px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .ymt-summary { font-size: 14px; line-height: 1.7; }
    .ymt-summary .ymt-err-title { color: #ff8a80; margin-top: 10px; }
    .ymt-summary .ymt-err-list { max-height: 200px; overflow-y: auto; font-size: 12px; color: #ff8a80; margin-top: 4px; }
    .ymt-summary .ymt-err-list .ymt-errline { white-space: normal; overflow: visible; }
    .ymt-actions { margin-top: 18px; display: flex; gap: 10px; }
    .ymt-btn {
        padding: 8px 16px; border-radius: 12px; cursor: pointer; font-size: 13px;
        border: 1px solid rgba(255,255,255,0.2); background: transparent; color: rgba(255,255,255,0.8);
    }
    .ymt-btn:hover { background: rgba(255,255,255,0.08); }
    .ymt-hint { margin-top: 12px; font-size: 12px; color: rgba(255,255,255,0.35); }
</style>
</head>
<body>
<div class="ymt-card">
    <h1 class="ymt-title" id="ymt-title">Скачивание плейлиста</h1>
    <div class="ymt-sub">YMX-tools — загрузка идёт в этой вкладке</div>

    <div id="ymt-progress">
        <div class="ymt-bar"><div class="ymt-fill" id="ymt-fill"></div></div>
        <div class="ymt-meta"><span id="ymt-count">Скачано: 0 из 0</span><span class="ymt-errcount" id="ymt-errors">Ошибок: 0</span></div>
        <div class="ymt-current" id="ymt-current"><span class="ymt-muted">Подготовка...</span></div>
        <div class="ymt-errors" id="ymt-errors-list"></div>
        <div class="ymt-actions"><button class="ymt-btn" id="ymt-cancel">Остановить</button></div>
        <div class="ymt-hint">Esc — остановить. Закрытие вкладки тоже остановит загрузку, уже скачанные архивы сохранятся.</div>
    </div>

    <div class="ymt-summary" id="ymt-summary" hidden></div>
    <div class="ymt-actions" id="ymt-close-wrap" hidden><button class="ymt-btn" id="ymt-close">Закрыть вкладку</button></div>
</div>

<script src="/src/lib/browser-polyfill.min.js"></script>
<script src="/src/lib/zip-writer.js"></script>
<script src="/src/features/download/zipjob.js"></script>
</body>
</html>
